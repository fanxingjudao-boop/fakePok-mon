name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Build v2 (共鳴バトル)
        working-directory: v2
        run: |
          npm ci
          npm run build

      - name: Build site
        run: |
          mkdir -p _site/world _site/v2
          cp index.html styles.css audio.js world-maps.js data.js story.js sprites.js monster-art.js battle.js game.js README.md _site/
          cp world/index.html world/world-data.js _site/world/
          cp v2/dist/index.html _site/v2/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
